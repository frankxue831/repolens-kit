[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "Repository scanning and typed, decaying memory for AI coding agents, served over MCP"
repository = "https://github.com/frankxue831/repolens-kit"
authors = ["Frank Xue"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }
rust_decimal = { version = "1", features = ["serde"] }
insta = { version = "1", features = ["json"] }
ignore = "0.4"
sha2 = "0.10"
hex = "0.4"
unicode-width = "0.2"
shell-words = "1"
tracing = "0.1"
tempfile = "3"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
tree-sitter = "0.25"
tree-sitter-java = "0.23"
tree-sitter-rust = "0.24"
tree-sitter-go = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-typescript = "0.23"
regex = "1"
once_cell = "1"
anyhow = "1"
rayon = "1"
uuid = { version = "1", features = ["v4"] }
repolens-core = { path = "crates/repolens-core" }
repolens-extract = { path = "crates/repolens-extract" }
repolens-app = { path = "crates/repolens-app" }
repolens-mcp = { path = "crates/repolens-mcp" }
repolens-profile = { path = "crates/repolens-profile" }
repolens-memory = { path = "crates/repolens-memory" }
repolens-wiki = { path = "crates/repolens-wiki" }
serde_yaml = "0.9"
gix = { version = "0.81", default-features = false, features = ["max-performance-safe", "sha1", "status"] }
clap = { version = "4", features = ["derive"] }
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
rmcp = { version = "1.3", features = ["server", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"] }
schemars = "1"
petgraph = "0.6"
tantivy = "0.22"
# Pinned to 0.8: FileExt::lock_exclusive() is non-deprecated here. 0.9+ deprecates
# the trait methods and would break `-D warnings`. Bump only with an API migration.
fs4 = { version = "0.8", features = ["sync"] }
